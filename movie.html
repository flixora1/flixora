<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Details - Flixora</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

.header{
    padding:18px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#080808;
    border-bottom:1px solid #222;
}

.logo{
    font-size:27px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#e50914;
}

.back-btn{
    color:white;
    text-decoration:none;
    background:#e50914;
    padding:10px 18px;
    border-radius:5px;
    font-weight:bold;
}

.back-btn:hover{
    background:#b20710;
}

.movie-details{
    max-width:1100px;
    margin:60px auto;
    padding:0 25px;
    display:flex;
    gap:45px;
    align-items:center;
}

.movie-poster{
    width:300px;
    flex-shrink:0;
}

.movie-poster img{
    width:100%;
    display:block;
    border-radius:10px;
    box-shadow:0 15px 40px rgba(0,0,0,.7);
}

.movie-info{
    max-width:650px;
}

.movie-info h1{
    font-size:48px;
    margin-bottom:15px;
}

.meta{
    display:flex;
    gap:18px;
    color:#bbb;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.rating{
    color:#ffd000;
}

.description{
    color:#ccc;
    font-size:16px;
    line-height:1.7;
    margin-bottom:25px;
}

.genre{
    color:#aaa;
    margin-bottom:25px;
}

.movie-actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.watch-btn,
.my-list-btn{
    border:none;
    padding:13px 24px;
    border-radius:5px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.watch-btn{
    background:#e50914;
    color:white;
}

.watch-btn:hover{
    background:#b20710;
}

.my-list-btn{
    border:1px solid #444;
    background:#151515;
    color:white;
}

.my-list-btn:hover{
    background:#252525;
}

.my-list-btn.added{
    background:#e50914;
    border-color:#e50914;
}

footer{
    margin-top:80px;
    padding:30px;
    text-align:center;
    border-top:1px solid #222;
    color:#777;
}

@media(max-width:700px){

    .header{
        padding:15px 18px;
    }

    .logo{
        font-size:22px;
    }

    .movie-details{
        margin-top:35px;
        flex-direction:column;
        align-items:flex-start;
    }

    .movie-poster{
        width:100%;
        max-width:280px;
        margin:auto;
    }

    .movie-info{
        width:100%;
    }

    .movie-info h1{
        font-size:34px;
    }

}

</style>

</head>

<body>

<header class="header">

    <div class="logo">
        FLIXORA<span>+</span>
    </div>

    <a href="index.html" class="back-btn">
        ← Back
    </a>

</header>
<main class="movie-details">

    <div class="movie-poster">

        <img
            id="moviePoster"
            src=""
            alt="Movie Poster"
        >

    </div>


    <div class="movie-info">

        <h1 id="movieTitle">
            Movie Title
        </h1>


        <div class="meta">

            <span id="movieYear">
                Year
            </span>

            <span
                id="movieRating"
                class="rating"
            >
                ⭐ Rating
            </span>

            <span id="movieRuntime">
                Runtime
            </span>

        </div>


        <p
            id="movieDescription"
            class="description"
        >
            Movie description loading...
        </p>


        <p
            id="movieGenre"
            class="genre"
        >
            🎬 Genre
        </p>


        <div class="movie-actions">

            <button
                class="watch-btn"
                id="watchMovieBtn"
                type="button"
            >
                ▶ Watch Movie
            </button>


            <button
                class="my-list-btn"
                id="myListBtn"
                type="button"
            >
                ♡ My List
            </button>

        </div>

    </div>

</main>


<footer>

    <div class="logo">
        FLIXORA<span>+</span>
    </div>

    <p>
        © 2026 Flixora. All Rights Reserved.
    </p>

</footer>
<script>

document.addEventListener("DOMContentLoaded", function () {

    /* ================= MOVIE DATABASE ================= */

    const movieDatabase = {

        "Inception": {
            title: "Inception",
            year: "2010",
            rating: "8.8",
            genre: "Sci-Fi • Thriller",
            runtime: "2h 28m",
            poster: "https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg",
            description: "A skilled thief who steals secrets through dreams is given a chance to erase his past by completing an impossible mission."
        },

        "Avengers: Infinity War": {
            title: "Avengers: Infinity War",
            year: "2018",
            rating: "8.4",
            genre: "Action • Adventure • Sci-Fi",
            runtime: "2h 29m",
            poster: "https://image.tmdb.org/t/p/w500/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg",
            description: "The Avengers and their allies face their greatest threat as Thanos seeks to collect the Infinity Stones."
        },

        "Interstellar": {
            title: "Interstellar",
            year: "2014",
            rating: "8.7",
            genre: "Sci-Fi • Drama • Adventure",
            runtime: "2h 49m",
            poster: "https://image.tmdb.org/t/p/w500/1E5baAaEse26fej7uHcjOgEE2t2.jpg",
            description: "A team of explorers travels through a wormhole in space in search of a new home for humanity."
        },

        "Wonder Woman": {
            title: "Wonder Woman",
            year: "2017",
            rating: "7.4",
            genre: "Action • Adventure • Fantasy",
            runtime: "2h 21m",
            poster: "https://image.tmdb.org/t/p/w500/8UlWHLMpgZm9bx6QYh0NFoq67TZ.jpg",
            description: "Diana, an Amazon warrior, leaves her island home and discovers her extraordinary powers while fighting to protect humanity."
        },

        "The Batman": {
            title: "The Batman",
            year: "2022",
            rating: "7.8",
            genre: "Crime • Drama • Action",
            runtime: "2h 56m",
            poster: "https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg",
            description: "Batman investigates a series of mysterious crimes while uncovering a dark conspiracy within Gotham City."
        },

        "Spider-Man": {
            title: "Spider-Man",
            year: "2021",
            rating: "8.2",
            genre: "Action • Adventure • Sci-Fi",
            runtime: "2h 28m",
            poster: "https://image.tmdb.org/t/p/w500/8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg",
            description: "A young superhero faces a dangerous new challenge when characters from other worlds enter his reality."
        }

    };


    /* ================= GET SELECTED MOVIE ================= */

    const savedMovie =
        localStorage.getItem("selectedMovie");


    let selectedMovie = null;


    if (savedMovie) {

        try {

            const parsed =
                JSON.parse(savedMovie);

            if (parsed && parsed.title) {

                selectedMovie =
                    movieDatabase[parsed.title] || parsed;

            }

        } catch (error) {

            selectedMovie =
                movieDatabase[savedMovie] || null;

        }

    }


    /* ================= MOVIE NOT FOUND ================= */

    if (!selectedMovie) {

        document.getElementById("movieTitle").textContent =
            "Movie Not Found";

        document.getElementById("movieDescription").textContent =
            "Please go back to the homepage and select a movie.";

        return;

    }


    /* ================= SHOW MOVIE ================= */

    document.getElementById("movieTitle").textContent =
        selectedMovie.title || "Unknown Movie";


    document.getElementById("movieYear").textContent =
        selectedMovie.year || "N/A";


    document.getElementById("movieRating").textContent =
        "⭐ " + (selectedMovie.rating || "N/A");


    document.getElementById("movieRuntime").textContent =
        selectedMovie.runtime || "N/A";


    document.getElementById("movieDescription").textContent =
        selectedMovie.description ||
        "No description available.";


    document.getElementById("movieGenre").textContent =
        "🎬 " +
        (selectedMovie.genre || "Unknown Genre");


    /* ================= POSTER ================= */

    const poster =
        document.getElementById("moviePoster");


    if (poster && selectedMovie.poster) {

        poster.src =
            selectedMovie.poster;

        poster.alt =
            selectedMovie.title + " Poster";

    }


    /* ================= SAVE CLEAN DATA ================= */

    localStorage.setItem(
        "selectedMovie",
        JSON.stringify(selectedMovie)
    );


    console.log(
        "FLIXORA MOVIE LOADED:",
        selectedMovie
    );


    /* ================= WATCH MOVIE ================= */

    const watchButton =
        document.getElementById("watchMovieBtn");


    if (watchButton) {

        watchButton.addEventListener(
            "click",
            function () {

                localStorage.setItem(
                    "selectedMovie",
                    JSON.stringify(selectedMovie)
                );


                window.location.href =
                    "watch.html";

            }
        );

    }

    /* ================= MY LIST ================= */

    const myListButton =
        document.getElementById("myListBtn");


    if (myListButton) {

        let myList =
            JSON.parse(
                localStorage.getItem("myList") || "[]"
            );


        const movieTitle =
            selectedMovie.title;


        /* CHECK IF ALREADY SAVED */

        if (myList.includes(movieTitle)) {

            myListButton.textContent =
                "♥ My List";

            myListButton.classList.add("added");

        }


        /* ADD / REMOVE MOVIE */

        myListButton.addEventListener(
            "click",
            function () {

                let currentList =
                    JSON.parse(
                        localStorage.getItem("myList") || "[]"
                    );


                const index =
                    currentList.indexOf(movieTitle);


                if (index === -1) {

                    /* ADD */

                    currentList.push(movieTitle);

                    myListButton.textContent =
                        "♥ My List";

                    myListButton.classList.add("added");

                } else {

                    /* REMOVE */

                    currentList.splice(index, 1);

                    myListButton.textContent =
                        "♡ My List";

                    myListButton.classList.remove("added");

                }


                localStorage.setItem(
                    "myList",
                    JSON.stringify(currentList)
                );


                console.log(
                    "FLIXORA MY LIST:",
                    currentList
                );

            }
        );

    }


    console.log(
        "🔥 FLIXORA MOVIE DETAILS READY"
    );

});


</script>

</body>

</html>
