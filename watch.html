<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watch Movie - Flixora</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

.header {
    height: 70px;
    padding: 0 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #080808;
    border-bottom: 1px solid #222;
}

.logo {
    font-size: 27px;
    font-weight: 900;
    letter-spacing: 2px;
}

.logo span {
    color: #e50914;
}

.back-btn {
    color: white;
    text-decoration: none;
    background: #e50914;
    padding: 10px 18px;
    border-radius: 5px;
    font-weight: bold;
}

.back-btn:hover {
    background: #b20710;
}

.movie-hero {
    position: relative;
    min-height: 480px;
    display: flex;
    align-items: center;
    overflow: hidden;
}

.hero-backdrop {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: blur(3px);
    transform: scale(1.08);
    opacity: .4;
}

.hero-overlay {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            90deg,
            #050505 0%,
            rgba(5,5,5,.9) 40%,
            rgba(5,5,5,.5) 75%,
            #050505 100%
        );
}

.hero-bottom {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 180px;
    background:
        linear-gradient(
            transparent,
            #050505
        );
}

.hero-content {
    position: relative;
    z-index: 5;
    max-width: 1200px;
    width: 100%;
    margin: auto;
    padding: 60px 30px;
    display: flex;
    align-items: center;
    gap: 40px;
}

.hero-poster {
    width: 230px;
    flex-shrink: 0;
}

.hero-poster img {
    width: 100%;
    display: block;
    border-radius: 10px;
    box-shadow:
        0 20px 60px rgba(0,0,0,.8);
}

.watch-title {
    max-width: 720px;
}

.now-playing {
    color: #e50914;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 16px;
}

.watch-title h1 {
    font-size: 52px;
    line-height: 1.1;
    margin-bottom: 15px;
}

.movie-meta {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    color: #ccc;
    margin-bottom: 20px;
}

#watchRating {
    color: #ffd000;
    font-weight: bold;
}

.watch-description {
    color: #ccc;
    font-size: 16px;
    line-height: 1.7;
    max-width: 700px;
}

.player-section {
    max-width: 1200px;
    margin: -20px auto 0;
    padding: 0 30px 50px;
    position: relative;
    z-index: 10;
}

.player-heading {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

.player-heading span {
    color: #e50914;
}

/* ================= PREMIUM VIDEO PLAYER ================= */

.custom-player {
    position: relative;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #242424;
    box-shadow:
        0 25px 70px rgba(0,0,0,.85);
    user-select: none;
    -webkit-user-select: none;
}

.custom-player video {
    width: 100%;
    display: block;
    aspect-ratio: 16 / 9;
    background: #000;
    object-fit: contain;
}

.custom-player:fullscreen {
    width: 100vw;
    height: 100vh;
}

.custom-player:fullscreen video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.video-loader{
    position:absolute;
    top:50%;
    left:50%;
    width:60px;
    height:60px;
    margin-left:-30px;
    margin-top:-30px;

    border:4px solid rgba(255,255,255,.2);
    border-top:4px solid #e50914;
    border-radius:50%;

    animation:spin .8s linear infinite;

    z-index:40;
    display:none;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

/* ================= CENTER CONTROLS ================= */

.skip-overlay {
    position: absolute;
    inset: 0;
    z-index: 25;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 42px;
    font-weight: 800;

    color: #fff;

    text-shadow:
        0 4px 20px rgba(0,0,0,.9);

    opacity: 0;
    pointer-events: none;

    transition: opacity .25s ease;
}

.skip-overlay.show {
    opacity: 1;
}

.center-controls {
    position: absolute;
    inset: 0;
    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 70px;

    pointer-events: none;

    opacity: 1;
    transition:
        opacity .3s ease,
        visibility .3s ease;
}

.center-controls {
    position: absolute;
    inset: 0;
}

.center-controls.hidden {
    opacity: 0;
    visibility: hidden;
}


/* CENTER BUTTON */

.center-control-btn {
    border: none;
    background: transparent;
    color: white;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        transform .2s ease,
        opacity .2s ease,
        background .2s ease;

    pointer-events: auto;

    text-shadow:
        0 2px 10px rgba(0,0,0,.9);
}

.center-control-btn:hover {
    transform: scale(1.12);
}


/* PLAY BUTTON */

.play-center-btn {
    width: 72px;
    height: 72px;

    border-radius: 50%;

    background: rgba(0,0,0,.58);

    border: 2px solid rgba(255,255,255,.85);

    font-size: 28px;

    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);

    box-shadow:
        0 8px 30px rgba(0,0,0,.5);
}


/* SKIP BUTTON */

.skip-btn {
    width: 58px;
    height: 58px;

    border-radius: 50%;

    flex-direction: column;

    background: rgba(0,0,0,.45);

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    opacity: .9;
}

.skip-btn:hover {
    background: rgba(0,0,0,.75);
}

.skip-icon {
    font-size: 25px;
    line-height: 20px;
}

.skip-time {
    font-size: 11px;
    font-weight: 700;
    line-height: 14px;
}


/* ================= BOTTOM CONTROLS ================= */

.controls {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 30;

    padding:
        35px
        18px
        14px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.96)
        );

    opacity: 1;

    transition:
        opacity .3s ease,
        visibility .3s ease;
}

.controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
}

.controls.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}


/* ================= SEEK BAR ================= */

.progress-container {
    position: relative;

    z-index: 50;

    width: 100%;
    height: 6px;

    background: rgba(255,255,255,.25);

    border-radius: 20px;

    cursor: pointer;

    margin-bottom: 13px;

    touch-action: none;

    transition: height .15s ease;
}

.progress-container:hover {
    height: 8px;
}


/* RED PROGRESS */

.progress {
    position: absolute;

    left: 0;
    top: 0;

    height: 100%;
    width: 0%;

    background: #e50914;

    border-radius: 20px;

    pointer-events: none;
}


/* SEEK CIRCLE */

.progress-thumb {
    position: absolute;

    top: 50%;
    left: 0%;

    width: 14px;
    height: 14px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 0 3px rgba(229,9,20,.25),
        0 2px 8px rgba(0,0,0,.7);

    pointer-events: none;

    opacity: 0;

    transition:
        opacity .15s ease,
        width .15s ease,
        height .15s ease;
}

.progress-container:hover .progress-thumb {
    opacity: 1;

    width: 16px;
    height: 16px;
}


/* ================= CONTROL ROW ================= */

.control-row {
    display: flex;

    align-items: center;

    gap: 10px;

    min-height: 34px;
}


/* ================= SMALL BUTTONS ================= */

.control-btn {
    border: none;

    background: transparent;

    color: white;

    cursor: pointer;

    font-size: 18px;

    width: 34px;
    height: 34px;

    border-radius: 7px;

    display: flex;

    align-items: center;
    justify-content: center;

    transition:
        background .2s ease,
        transform .2s ease,
        color .2s ease;
}

.control-btn:hover {
    background: rgba(255,255,255,.13);

    transform: scale(1.05);
}


/* ================= TIME ================= */

.time {
    color: #e6e6e6;

    font-size: 13px;

    font-weight: 500;

    white-space: nowrap;

    letter-spacing: .2px;
}


/* ================= VOLUME ================= */

.volume {
    width: 85px;

    height: 4px;

    accent-color: #e50914;

    cursor: pointer;
}


/* ================= SPACER ================= */

.spacer {
    flex: 1;
}


/* ================= SETTINGS ================= */

.settings-wrapper {
    position: relative;
}

.settings-menu {
    position: absolute;

    right: 0;
    bottom: 45px;

    width: 155px;

    background: rgba(20,20,20,.97);

    border: 1px solid #333;

    border-radius: 9px;

    padding: 8px;

    display: none;

    box-shadow:
        0 15px 40px rgba(0,0,0,.8);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.settings-menu.show {
    display: block;
}

.settings-menu button {
    width: 100%;

    border: none;

    background: transparent;

    color: white;

    text-align: left;

    padding: 10px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 13px;

    transition:
        background .2s ease;
}

.settings-menu button:hover {
    background: #252525;
}


/* ================= MOBILE PLAYER ================= */

@media (max-width: 750px) {

    .custom-player {
        border-radius: 8px;
    }


    /* CENTER BUTTONS */

    .center-controls {
        gap: 28px;
    }


    .play-center-btn {
        width: 58px;
        height: 58px;

        font-size: 22px;
    }


    .skip-btn {
        width: 46px;
        height: 46px;
    }


    .skip-icon {
        font-size: 20px;
    }


    .skip-time {
        font-size: 9px;
    }


    /* BOTTOM CONTROLS */

    .controls {
        padding:
            28px
            9px
            9px;
    }


    .progress-container {
        height: 5px;

        margin-bottom: 8px;
    }


    .progress-container:hover {
        height: 6px;
    }


    .progress-thumb {
        width: 12px;
        height: 12px;
    }


    .control-row {
        gap: 3px;
    }


    .control-btn {
        width: 30px;
        height: 30px;

        font-size: 16px;
    }


    .volume {
        width: 48px;
    }


    .time {
        font-size: 10px;
    }


    .settings-menu {
        width: 135px;

        bottom: 40px;
    }

}

.hidden {
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
}

.center-controls,
.controls {
    transition: opacity .3s ease;
}

.notice {
    margin-top: 18px;
    padding: 16px;
    background: #101010;
    border: 1px solid #242424;
    border-left: 3px solid #e50914;
    border-radius: 6px;
    color: #999;
    font-size: 14px;
    line-height: 1.6;
}

footer {
    margin-top: 30px;
    padding: 30px;
    text-align: center;
    border-top: 1px solid #222;
    color: #777;
}

@media (max-width: 750px) {

    .header {
        height: 62px;
        padding: 0 18px;
    }

    .logo {
        font-size: 22px;
    }

    .back-btn {
        padding: 8px 13px;
        font-size: 14px;
    }

    .movie-hero {
        min-height: auto;
    }

    .hero-content {
        padding: 45px 18px 70px;
        flex-direction: column;
        text-align: center;
        gap: 25px;
    }

    .hero-overlay {
        background:
            linear-gradient(
                180deg,
                rgba(5,5,5,.65),
                #050505 90%
            );
    }

    .hero-poster {
        width: 190px;
    }

    .watch-title h1 {
        font-size: 34px;
    }

    .movie-meta {
        justify-content: center;
        gap: 12px;
        font-size: 14px;
    }

    .watch-description {
        font-size: 15px;
    }

    .player-section {
        margin-top: -15px;
        padding: 0 18px 40px;
    }

    .player-heading {
        font-size: 19px;
    }

    .control-row {
        gap: 5px;
    }

    .volume {
        width: 55px;
    }

    .time {
        font-size: 11px;
    }

    .control-btn {
        width: 30px;
        height: 30px;
    }

}

.unlock-btn{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    z-index:999;

    width:48px;
    height:48px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,.75);

    color:white;

    display:none;

    align-items:center;
    justify-content:center;
}

.control-btn svg,
.center-control-btn svg{
    width:22px;
    height:22px;
    stroke-width:2.3;
}

.play-center-btn svg{
    width:28px;
    height:28px;
}

</style>

<script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<header class="header">

    <div class="logo">
        FLIXORA<span>+</span>
    </div>

    <a
        href="index.html"
        class="back-btn"
    >
        ← Home
    </a>

</header>

<section class="movie-hero">

    <div
        class="hero-backdrop"
        id="heroBackdrop"
    ></div>

    <div class="hero-overlay"></div>

    <div class="hero-bottom"></div>

    <div class="hero-content">

        <div class="hero-poster">

            <img
                id="watchPoster"
                src=""
                alt="Movie Poster"
            >

        </div>

        <div class="watch-title">

            <div class="now-playing">
                ● NOW PLAYING ON FLIXORA
            </div>

            <h1 id="watchTitle">
                Loading...
            </h1>

            <div class="movie-meta">

                <span id="watchYear">
                    Loading...
                </span>

                <span id="watchRating">
                    ⭐ Loading...
                </span>

                <span id="watchGenre">
                    🎬 Loading...
                </span>

            </div>

            <p
                id="watchDescription"
                class="watch-description"
            >
                Loading movie information...
            </p>

        </div>

    </div>

</section>
<section class="player-section">

    <div class="player-heading">
        ▶ <span>Watch</span> Movie
    </div>

<div class="custom-player" id="customPlayer">

<button
id="unlockBtn"
class="unlock-btn"
type="button"
>
<i data-lucide="lock-open"></i>
</button>

    <video
        id="moviePlayer"
        playsinline
        preload="metadata"
    >

        <source
            src="https://www.w3schools.com/html/mov_bbb.mp4"
            type="video/mp4"
        >

<track
    id="englishTrack"
    kind="subtitles"
    label="English"
    srclang="en"
    src="english.vtt"
    default
>

        Your browser does not support video playback.

    </video>

<div id="loader" class="video-loader"></div>

<div class="video-click-layer" id="videoClickLayer"></div>

    <!-- CENTER VIDEO CONTROLS -->

<div id="skipOverlay" class="skip-overlay">
    +10s
</div>

    <div
        class="center-controls"
        id="centerControls"
    >

        <button
            class="center-control-btn skip-btn"
            id="back10Btn"
            type="button"
            title="Back 10 seconds"
        >
            <span class="skip-icon">↶</span>
            <span class="skip-time">10</span>
        </button>


<button
class="center-control-btn play-center-btn"
id="playBtn"
type="button">
<i data-lucide="play"></i>
</button>


        <button
            class="center-control-btn skip-btn"
            id="forward30Btn"
            type="button"
            title="Forward 30 seconds"
        >
            <span class="skip-time">30</span>
            <span class="skip-icon">↷</span>
        </button>

    </div>


    <!-- BOTTOM PLAYER CONTROLS -->

    <div
        class="controls"
        id="playerControls"
    >

        <!-- SEEK BAR -->

        <div
            class="progress-container"
            id="progressContainer"
        >

            <div
                class="progress"
                id="progress"
            ></div>

            <div
                class="progress-thumb"
                id="progressThumb"
            ></div>

        </div>


        <!-- CONTROL ROW -->

        <div class="control-row">

<button
class="control-btn"
id="muteBtn"
type="button">
<i data-lucide="volume-2"></i>
</button>


            <input
                type="range"
                class="volume"
                id="volumeSlider"
                min="0"
                max="1"
                step="0.05"
                value="1"
                aria-label="Volume"
            >


            <span
                class="time"
                id="timeDisplay"
            >
                0:00 / 0:00
            </span>


            <div class="spacer"></div>


<button
class="control-btn"
id="subtitleBtn"
type="button">
<i data-lucide="captions"></i>
</button>


            <div class="settings-wrapper">

                <button
                    class="control-btn"
                    id="settingsBtn"
                    type="button"
                    title="Settings"
                >
<i data-lucide="settings"></i>
                </button>


<div
    class="settings-menu"
    id="settingsMenu"
>

    <button
        type="button"
        class="speed-option"
        data-speed="0.5"
    >
        Speed 0.5x
    </button>

    <button
        type="button"
        class="speed-option"
        data-speed="1"
    >
        Speed 1x
    </button>

    <button
        type="button"
        class="speed-option"
        data-speed="1.5"
    >
        Speed 1.5x
    </button>

    <button
        type="button"
        class="speed-option"
        data-speed="2"
    >
        Speed 2x
    </button>

<hr style="border-color:#333;margin:8px 0;">

<button
    type="button"
    class="quality-option"
    data-quality="Auto"
>
    Quality: Auto
</button>

<button
    type="button"
    class="quality-option"
    data-quality="1080p"
>
    1080p
</button>

<button
    type="button"
    class="quality-option"
    data-quality="720p"
>
    720p
</button>

<button
    type="button"
    class="quality-option"
    data-quality="480p"
>
    480p
</button>

</div>

            </div>

<button
class="control-btn"
id="lockBtn"
type="button"
title="Lock Screen"
>
<i data-lucide="lock"></i>
</button>

            <button
                class="control-btn"
                id="fullscreenBtn"
                type="button"
                title="Fullscreen"
            >
<i data-lucide="maximize"></i>
            </button>

        </div>

    </div>

</div>


    <div class="notice">

        🎬 <strong>Demo Player</strong> —
        Authorized movie/video content
        can be connected here.

    </div>

</section>
<script>

document.addEventListener("DOMContentLoaded", function () {

    /* ================= MOVIE DATABASE ================= */

    const db = {

        "Inception": {
            title: "Inception",
            year: "2010",
            rating: "8.8",
            genre: "Sci-Fi • Thriller",
            poster: "https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg",
            description: "A skilled thief who steals secrets through dreams is given a chance to erase his past by completing an impossible mission."
        },

        "Avengers: Infinity War": {
            title: "Avengers: Infinity War",
            year: "2018",
            rating: "8.4",
            genre: "Action • Adventure • Sci-Fi",
            poster: "https://image.tmdb.org/t/p/w500/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg",
            description: "The Avengers and their allies face their greatest threat as Thanos seeks to collect the Infinity Stones."
        },

        "Interstellar": {
            title: "Interstellar",
            year: "2014",
            rating: "8.7",
            genre: "Sci-Fi • Drama • Adventure",
            poster: "https://image.tmdb.org/t/p/w500/1E5baAaEse26fej7uHcjOgEE2t2.jpg",
            description: "A team of explorers travels through a wormhole in space in search of a new home for humanity."
        },

        "Wonder Woman": {
            title: "Wonder Woman",
            year: "2017",
            rating: "7.4",
            genre: "Action • Adventure • Fantasy",
            poster: "https://image.tmdb.org/t/p/w500/8UlWHLMpgZm9bx6QYh0NFoq67TZ.jpg",
            description: "Diana, an Amazon warrior, leaves her island home and discovers her extraordinary powers while fighting to protect humanity."
        },

        "The Batman": {
            title: "The Batman",
            year: "2022",
            rating: "7.8",
            genre: "Crime • Drama • Action",
            poster: "https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg",
            description: "Batman investigates a series of mysterious crimes while uncovering a dark conspiracy within Gotham City."
        },

        "Spider-Man": {
            title: "Spider-Man",
            year: "2021",
            rating: "8.2",
            genre: "Action • Adventure • Sci-Fi",
            poster: "https://image.tmdb.org/t/p/w500/8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg",
            description: "A young superhero faces a dangerous new challenge when characters from other worlds enter his reality."
        }

    };


    /* ================= LOAD SELECTED MOVIE ================= */

    const savedMovie =
        localStorage.getItem("selectedMovie");

    const movieProgressKey =
        "progress_" + savedMovie;

    let movie = null;


    if (savedMovie) {

        try {

            const data =
                JSON.parse(savedMovie);

            if (data && data.title) {

                movie =
                    db[data.title] || data;

            }

        } catch (error) {

            movie =
                db[savedMovie] || null;

        }

    }


    /* ================= SHOW MOVIE ================= */

    if (!movie) {

        document.getElementById("watchTitle").textContent =
            "Movie Not Found";

        document.getElementById("watchDescription").textContent =
            "Please go back to the homepage and select a movie.";

    } else {

        document.getElementById("watchTitle").textContent =
            movie.title;

        document.getElementById("watchYear").textContent =
            movie.year;

        document.getElementById("watchRating").textContent =
            "⭐ " + movie.rating;

        document.getElementById("watchGenre").textContent =
            "🎬 " + movie.genre;

        document.getElementById("watchDescription").textContent =
            movie.description;


        const poster =
            document.getElementById("watchPoster");

        if (poster) {

            poster.src =
                movie.poster;

            poster.alt =
                movie.title + " Poster";

        }


        const backdrop =
            document.getElementById("heroBackdrop");

        if (backdrop) {

            backdrop.style.backgroundImage =
                `url("${movie.poster}")`;

        }


        document.title =
            "Watch " + movie.title + " - Flixora";

    }


    /* ================= PLAYER ================= */

    const video =
        document.getElementById("moviePlayer");

    const player =
        document.getElementById("customPlayer");

    const playBtn =
        document.getElementById("playBtn");

lucide.createIcons();

if (playBtn) {

    playBtn.innerHTML =
        '<i data-lucide="play"></i>';

}

        const back10Btn =
    document.getElementById("back10Btn");

const forward30Btn =
    document.getElementById("forward30Btn");

    const muteBtn =
        document.getElementById("muteBtn");

    const volume =
        document.getElementById("volumeSlider");

    const progressBox =
        document.getElementById("progressContainer");

    const progress =
        document.getElementById("progress");

    const time =
        document.getElementById("timeDisplay");

    const fullscreen =
        document.getElementById("fullscreenBtn");

    const settings =
        document.getElementById("settingsBtn");

    const menu =
        document.getElementById("settingsMenu");

    const speedOptions =
        document.querySelectorAll(".speed-option");

const qualityOptions =
    document.querySelectorAll(".quality-option");

const centerControls =
    document.getElementById("centerControls");

const playerControls =
    document.getElementById("playerControls");

const progressThumb =
    document.getElementById("progressThumb");

const videoClickLayer =
    document.getElementById("videoClickLayer");

const skipOverlay =
    document.getElementById("skipOverlay");

const loader =
    document.getElementById("loader");

let hideControlsTimer;

let lastTap = 0;

const lockBtn =
    document.getElementById("lockBtn");

const unlockBtn =
    document.getElementById("unlockBtn");

let isLocked = false;

const savedProgress =
    localStorage.getItem(movieProgressKey);

if (video && savedProgress) {

    video.addEventListener(
        "loadedmetadata",
        function () {

            video.currentTime =
                Number(savedProgress);

        }
    );

}

    /* ================= PLAY / PAUSE ================= */

    if (playBtn && video) {

        playBtn.addEventListener(
            "click",
            function () {

                if (video.paused) {

                    video.play();

                } else {

                    video.pause();

                }

            }
        );

    }


    if (video) {

video.addEventListener(
    "play",
    function () {

        if (playBtn) {

            playBtn.innerHTML =
                '<i data-lucide="pause"></i>';

            lucide.createIcons();

        }

    }
);

video.addEventListener(
    "pause",
    function () {

        if (playBtn) {

            playBtn.innerHTML =
                '<i data-lucide="play"></i>';

            lucide.createIcons();

        }

    }
);

    }
  
    /* ================= SKIP CONTROLS ================= */

if (back10Btn && video) {

    back10Btn.addEventListener(
        "click",
        function () {

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 10
                );

        }
    );

}


if (forward30Btn && video) {

    forward30Btn.addEventListener(
        "click",
        function () {

            video.currentTime =
                Math.min(
                    video.duration,
                    video.currentTime + 30
                );

        }
    );

}


    /* ================= MUTE ================= */

if (muteBtn && video) {

    muteBtn.addEventListener(
        "click",
        function () {

            video.muted = !video.muted;

            if (video.muted) {

                muteBtn.innerHTML =
                    '<i data-lucide="volume-x"></i>';

            } else {

                muteBtn.innerHTML =
                    '<i data-lucide="volume-2"></i>';

            }

            lucide.createIcons();

        }
    );

}


    /* ================= VOLUME ================= */

if (muteBtn) {

    if (video.volume === 0) {

        muteBtn.innerHTML =
            '<i data-lucide="volume-x"></i>';

    } else {

        muteBtn.innerHTML =
            '<i data-lucide="volume-2"></i>';

    }

    lucide.createIcons();

}


    /* ================= TIME ================= */

    function formatTime(seconds) {

        if (!isFinite(seconds)) {
            return "0:00";
        }

        const minutes =
            Math.floor(seconds / 60);

        const secondsPart =
            Math.floor(seconds % 60);

        return (
            minutes +
            ":" +
            String(secondsPart).padStart(2, "0")
        );

    }


    if (video) {

        video.addEventListener(
            "timeupdate",
            function () {

                if (!video.duration) {
                    return;
                }

                const percent =
                    (video.currentTime /
                    video.duration) * 100;

                if (progress) {

                    progress.style.width =
                        percent + "%";

if (progressThumb) {

    progressThumb.style.left =
        percent + "%";

}

                }

                if (time) {

                    time.textContent =
                        formatTime(
                            video.currentTime
                        ) +
                        " / " +
                        formatTime(
                            video.duration
                        );

                }

 localStorage.setItem(
    movieProgressKey,
    video.currentTime
  );
}
);

    }
    /* ================= SEEK ================= */

    function seekVideo(clientX) {

        if (
            !video ||
            !progressBox ||
            !video.duration ||
            !isFinite(video.duration)
        ) {
            return;
        }

        const rect =
            progressBox.getBoundingClientRect();

        let percent =
            (clientX - rect.left) /
            rect.width;

        percent =
            Math.max(
                0,
                Math.min(1, percent)
            );

        video.currentTime =
            percent * video.duration;

    }


    if (progressBox) {

        progressBox.addEventListener(
            "click",
            function (event) {

                seekVideo(
                    event.clientX
                );

            }
        );


        progressBox.addEventListener(
            "touchstart",
            function (event) {

                event.preventDefault();

                if (event.touches[0]) {

                    seekVideo(
                        event.touches[0].clientX
                    );

                }

            },
            { passive: false }
        );


        progressBox.addEventListener(
            "touchmove",
            function (event) {

                event.preventDefault();

                if (event.touches[0]) {

                    seekVideo(
                        event.touches[0].clientX
                    );

                }

            },
            { passive: false }
        );

    }


    /* ================= SUBTITLE ================= */

    const subtitleBtn =
        document.getElementById(
            "subtitleBtn"
        );

const track =
    document.getElementById("englishTrack");

if (track && subtitleBtn) {

    track.mode = "hidden";

    subtitleBtn.addEventListener(
        "click",
        function () {

            if (track.mode === "showing") {

                track.mode = "hidden";

                subtitleBtn.style.color =
                    "white";

            } else {

                track.mode = "showing";

                subtitleBtn.style.color =
                    "#e50914";

            }

        }
    );

}


    /* ================= FULLSCREEN ================= */

    if (fullscreen) {

        fullscreen.addEventListener(
            "click",
            async function () {

                try {

                    if (!document.fullscreenElement) {

                        if (player) {

                            await player.requestFullscreen();

                        }

                    } else {

                        await document.exitFullscreen();

setTimeout(() => {
    showControls();
}, 200);

                    }

                } catch (error) {

                    if (
                        video &&
                        video.webkitEnterFullscreen
                    ) {

                        video.webkitEnterFullscreen();

                    }

                }

            }
        );

    }


    /* ================= SETTINGS ================= */

    if (settings && menu) {

        settings.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                menu.classList.toggle("show");

            }
        );


        menu.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

            }
        );


        document.addEventListener(
            "click",
            function () {

                menu.classList.remove("show");

            }
        );

    }

/* ================= PLAYBACK SPEED ================= */

if (speedOptions.length && video) {

    speedOptions.forEach(function (button) {

        button.addEventListener(
            "click",
            function () {

                const speed =
                    Number(
                        button.dataset.speed
                    );

                video.playbackRate =
                    speed;

                speedOptions.forEach(function (btn) {

                    btn.style.color =
                        "white";

                });

                button.style.color =
                    "#e50914";

            }
        );

    });

}

if (lockBtn && unlockBtn) {

    lockBtn.addEventListener(
        "click",
        function () {

            isLocked = true;

            if (centerControls) {
                centerControls.style.display = "none";
            }

            if (playerControls) {
                playerControls.style.display = "none";
            }

            unlockBtn.style.display = "flex";
            
            setTimeout(function () {

    if (isLocked) {

        unlockBtn.style.opacity = "0";

    }

}, 3000);
            
        }
    );

    unlockBtn.addEventListener(
        "click",
        function () {

            isLocked = false;

unlockBtn.style.display = "none";
unlockBtn.style.opacity = "1";

            if (centerControls) {
                centerControls.style.display = "";
            }

            if (playerControls) {
                playerControls.style.display = "";
            }

            unlockBtn.style.display = "none";

            showControls();
        }
    );

}

/* ================= QUALITY SELECTOR ================= */

if (qualityOptions.length) {

    qualityOptions.forEach(function (button) {

        button.addEventListener(
            "click",
            function () {

                const quality =
                    button.dataset.quality;

                qualityOptions.forEach(function (btn) {

                    btn.style.color =
                        "white";

                });

                button.style.color =
                    "#e50914";

                console.log(
                    "Quality Selected:",
                    quality
                );

            }
        );

    });

}

    /* ================= VIDEO CLICK ================= */

if (video) {

    video.addEventListener(
        "click",
        function (e) {

            const now = Date.now();

            const tapLength =
                now - lastTap;

            if (tapLength < 300) {

                const rect =
                    video.getBoundingClientRect();

                const x =
                    e.clientX - rect.left;

                if (x < rect.width / 2) {

                    video.currentTime =
                        Math.max(
                            0,
                            video.currentTime - 10
                        );

showSkip("↶ 10s");

                } else {

                    video.currentTime =
                        Math.min(
                            video.duration,
                            video.currentTime + 10
                        );

showSkip("10s ↷");

                }

            } else {

                showControls();

            }

            lastTap = now;

        }
    );

}

if (player) {

    player.addEventListener("click", function () {

if (isLocked) {

    unlockBtn.style.display = "flex";
    unlockBtn.style.opacity = "1";

    return;
}

        if (centerControls) {
            centerControls.classList.remove("hidden");
        }

        if (playerControls) {
            playerControls.classList.remove("hidden");
        }

        clearTimeout(hideControlsTimer);

        hideControlsTimer = setTimeout(function () {

            if (!video.paused) {

                if (centerControls) {
                    centerControls.classList.add("hidden");
                }

                if (playerControls) {
                    playerControls.classList.add("hidden");
                }

            }

        }, 3000);

    });

}

/* ================= AUTO HIDE CONTROLS ================= */

function showSkip(text) {

    if (!skipOverlay) return;

    skipOverlay.textContent = text;

    skipOverlay.classList.add("show");

    setTimeout(function () {

        skipOverlay.classList.remove("show");

    }, 450);

}

function showControls() {

    if (centerControls) {
        centerControls.classList.remove("hidden");
    }

    if (playerControls) {
        playerControls.classList.remove("hidden");
    }

if (isLocked) {
    return;
}

    clearTimeout(hideControlsTimer);

    hideControlsTimer = setTimeout(
        function () {

            if (!video.paused) {

                if (centerControls) {
                    centerControls.classList.add("hidden");
                }

                if (playerControls) {
                    playerControls.classList.add("hidden");
                }

            }

        },
        3000
    );

}


if (player) {

    player.addEventListener(
        "mousemove",
        showControls
    );

    player.addEventListener(
        "touchstart",
        showControls
    );

}


if (video) {

    video.addEventListener(
        "play",
        showControls
    );

    video.addEventListener(
        "pause",
        showControls
    );

}

if (video && loader) {

    video.addEventListener(
        "waiting",
        function () {

            loader.style.display = "block";

        }
    );

    video.addEventListener(
        "playing",
        function () {

            loader.style.display = "none";

        }
    );

}

    lucide.createIcons();

    console.log(
        "🔥 FLIXORA WATCH PAGE READY"
    );

});

</script>
